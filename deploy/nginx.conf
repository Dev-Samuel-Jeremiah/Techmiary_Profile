# /etc/nginx/sites-available/techmiary
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/techmiary
#   sudo ln -s /etc/nginx/sites-available/techmiary /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Configured for techmiary.tech. The apex is canonical and www redirects to it, so
# every page has exactly one address — which is what SITE_URL, the canonical
# link tags and the sitemap all assume. To make www canonical instead, swap the
# two server_name values in the HTTPS blocks below and change SITE_URL to match.
#
# No server IP is hard-coded here.

upstream techmiary_app {
    server unix:/run/gunicorn/techmiary-portfolio.sock fail_timeout=0;
}

# Per-IP throttles for the endpoints that write to the database. SQLite
# serialises writes, so a burst of form posts queues on one lock — shedding it
# at the edge is cheaper than letting it reach Gunicorn.
#
# These are http-context directives. On Debian and Ubuntu that is satisfied by
# sites-enabled being included inside http{}, so they can live here. If you
# include this file somewhere else, move these two lines to nginx.conf.
limit_req_zone $binary_remote_addr zone=forms:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

# ---- HTTP: everything goes to HTTPS on the apex ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name techmiary.tech www.techmiary.tech;

    # Certbot writes its challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://techmiary.tech$request_uri;
    }
}

# ---- HTTPS on www: redirect to the apex ------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.techmiary.tech;

    ssl_certificate     /etc/letsencrypt/live/techmiary.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techmiary.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://techmiary.tech$request_uri;
}

# ---- HTTPS: the site -------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name techmiary.tech;

    # Managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/techmiary.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techmiary.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # CV uploads are capped at 5 MB by the application; leave headroom for the
    # multipart envelope and reject anything larger before it reaches Python.
    client_max_body_size 8M;
    client_body_timeout 30s;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml;

    # Security headers that Django does not set itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/techmiary.access.log;
    error_log  /var/log/nginx/techmiary.error.log;

    # --- Never serve these ---------------------------------------------------
    # The database lives outside the web root, but a future path change or a
    # stray symlink should not be the only thing standing between the internet
    # and db.sqlite3.
    location ~ /\.               { deny all; access_log off; log_not_found off; }
    location ~* \.(sqlite3|sqlite3-wal|sqlite3-shm|db|env|py|pyc|log|bak|sql)$ {
        deny all;
        access_log off;
    }

    # --- Static files --------------------------------------------------------
    # Names are content-hashed by CompressedManifestStaticFilesStorage, so a
    # one-year immutable cache is safe: a changed file gets a new name.
    location /static/ {
        alias /srv/portfolio/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Uploaded media ------------------------------------------------------
    # Served as inert files. The nested block refuses anything with an
    # executable extension, so a file uploaded with a crafted name cannot be
    # run even if a handler for it is installed later.
    location /media/ {
        alias /srv/portfolio/data/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;

        location ~* \.(php|phtml|py|pl|cgi|sh|jsp|asp|aspx|exe)$ {
            deny all;
        }
    }

    # CVs submitted through the careers form are personal data sitting at a
    # guessable path. Uncomment to block direct web access entirely — note that
    # the download link in the Django admin goes through this same path, so
    # staff would then have to read them off the server.
    # location /media/careers/ { deny all; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; proxy_pass http://techmiary_app; }

    # --- Application ---------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_pass http://techmiary_app;
    }

    # The write endpoints, throttled harder.
    location ~ ^/(contact|quote|newsletter|careers/.+/apply)/ {
        limit_req zone=forms burst=10 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_pass http://techmiary_app;
    }
}

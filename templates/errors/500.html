{% extends "base.html" %}
{% block title %}Server error — 500{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}
<section class="lx-banner lx-error error-page" data-hero>
  <div class="lx-hero__glow" aria-hidden="true"></div>
  <div class="lx-hero__grid" aria-hidden="true"></div>
  <canvas class="lx-banner__canvas" data-scene="ring" aria-hidden="true"></canvas>
  <div class="container-page">
    <div class="lx-error__code error-code" aria-hidden="true">500</div>
    <h1>Something went wrong on our side</h1>
    <p>The error has been logged and we are looking at it. Please try again in a moment.</p>
    <div class="lx-actions">
      <a class="btn btn-lx btn-lg" data-magnetic href="/">Back to home</a>
    </div>
  </div>
</section>
{% endblock %}

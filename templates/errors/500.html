{% extends "base.html" %}
{% block title %}Server error — 500{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}
<section class="error-page">
  <div class="container-page">
    <div class="error-code" aria-hidden="true">500</div>
    <h1 style="font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:.75rem">Something went wrong on our side</h1>
    <p class="text-muted-2" style="max-width:48ch;margin-inline:auto">The error has been logged and we are looking at it. Please try again in a moment.</p>
    <div class="hero__actions" style="justify-content:center">
      <a class="btn btn-primary" href="/">Back to home</a>
    </div>
  </div>
</section>
{% endblock %}
